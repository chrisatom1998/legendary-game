<svg xmlns="http://www.w3.org/2000/svg" width="300" height="600" viewBox="0 0 300 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D1A"/>
      <stop offset="50%" style="stop-color:#1A1A3E"/>
      <stop offset="100%" style="stop-color:#2D1B4E"/>
    </linearGradient>
    <linearGradient id="toggleOn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="600" fill="url(#bg)"/>

  <!-- Background Stars -->
  <circle cx="40" cy="80" r="1" fill="white" opacity="0.5"/>
  <circle cx="260" cy="120" r="1.5" fill="#22D3EE" opacity="0.4"/>
  <circle cx="20" cy="200" r="1" fill="white" opacity="0.3"/>
  <circle cx="280" cy="350" r="1" fill="#A78BFA" opacity="0.4"/>
  <circle cx="50" cy="450" r="1" fill="white" opacity="0.3"/>
  <circle cx="250" cy="520" r="1.5" fill="#22D3EE" opacity="0.4"/>
  <circle cx="150" cy="580" r="1" fill="white" opacity="0.3"/>

  <!-- Header Area -->
  <!-- Back Button (Glassmorphism) -->
  <rect x="12" y="35" width="44" height="44" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="34" y="64" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">&lt;</text>

  <!-- Title with gradient effect -->
  <text x="72" y="65" fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="bold" letter-spacing="3">SETTINGS</text>

  <!-- Audio Section Label -->
  <g transform="translate(30, 115)">
    <circle cx="0" cy="0" r="6" fill="#8B5CF6" opacity="0.5"/>
    <text x="14" y="4" fill="#8B5CF6" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">AUDIO</text>
  </g>

  <!-- Audio Section Container (Glassmorphism) -->
  <rect x="15" y="130" width="270" height="130" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Sound Effects Row -->
  <rect x="30" y="148" width="44" height="44" rx="12" fill="rgba(139,92,246,0.2)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="52" y="177" fill="#8B5CF6" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" filter="url(#smallGlow)">♪</text>
  <text x="85" y="167" fill="white" font-family="Arial, sans-serif" font-size="15" font-weight="600">Sound Effects</text>
  <text x="85" y="184" fill="rgba(255,255,255,0.5)" font-family="Arial, sans-serif" font-size="11">Play sounds when tapping</text>

  <!-- Premium Toggle ON -->
  <rect x="218" y="156" width="56" height="32" rx="16" fill="url(#toggleOn)" filter="url(#glow)"/>
  <rect x="218" y="156" width="56" height="16" rx="8" fill="rgba(255,255,255,0.15)"/>
  <circle cx="250" cy="172" r="13" fill="white">
    <animate attributeName="cx" values="250;250" dur="1s"/>
  </circle>
  <text x="250" y="177" fill="#8B5CF6" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">✓</text>

  <!-- Divider -->
  <line x1="30" y1="205" x2="270" y2="205" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Background Music Row -->
  <rect x="30" y="218" width="44" height="44" rx="12" fill="rgba(139,92,246,0.2)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="52" y="247" fill="#8B5CF6" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" filter="url(#smallGlow)">♫</text>
  <text x="85" y="237" fill="white" font-family="Arial, sans-serif" font-size="15" font-weight="600">Background Music</text>
  <text x="85" y="254" fill="rgba(255,255,255,0.5)" font-family="Arial, sans-serif" font-size="11">Play music during gameplay</text>

  <!-- Premium Toggle OFF -->
  <rect x="218" y="226" width="56" height="32" rx="16" fill="rgba(255,255,255,0.1)"/>
  <circle cx="237" cy="242" r="13" fill="white" opacity="0.9"/>

  <!-- About Section Label -->
  <g transform="translate(30, 295)">
    <circle cx="0" cy="0" r="6" fill="#22D3EE" opacity="0.5"/>
    <text x="14" y="4" fill="#22D3EE" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">ABOUT</text>
  </g>

  <!-- About Section Container (Glassmorphism) -->
  <rect x="15" y="310" width="270" height="130" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- App Info Row -->
  <rect x="30" y="328" width="44" height="44" rx="12" fill="rgba(34,211,238,0.2)" stroke="rgba(34,211,238,0.3)" stroke-width="1"/>
  <text x="52" y="357" fill="#22D3EE" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" filter="url(#smallGlow)">⬡</text>
  <text x="85" y="347" fill="white" font-family="Arial, sans-serif" font-size="15" font-weight="600">Sky Taps</text>
  <text x="85" y="364" fill="rgba(255,255,255,0.5)" font-family="Arial, sans-serif" font-size="11">Version 1.0.0</text>

  <!-- Divider -->
  <line x1="30" y1="385" x2="270" y2="385" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Flutter Info Row -->
  <rect x="30" y="398" width="44" height="44" rx="12" fill="rgba(34,211,238,0.2)" stroke="rgba(34,211,238,0.3)" stroke-width="1"/>
  <text x="52" y="427" fill="#22D3EE" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" filter="url(#smallGlow)">&lt;/&gt;</text>
  <text x="85" y="417" fill="white" font-family="Arial, sans-serif" font-size="15" font-weight="600">Made with Flutter</text>
  <text x="85" y="434" fill="rgba(255,255,255,0.5)" font-family="Arial, sans-serif" font-size="11">Cross-platform mobile game</text>

  <!-- Credits Section Label -->
  <g transform="translate(30, 475)">
    <circle cx="0" cy="0" r="6" fill="#F472B6" opacity="0.5"/>
    <text x="14" y="4" fill="#F472B6" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">CREDITS</text>
  </g>

  <!-- Credits Section Container (Glassmorphism) -->
  <rect x="15" y="490" width="270" height="70" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Credits Row -->
  <rect x="30" y="508" width="44" height="44" rx="12" fill="rgba(244,114,182,0.2)" stroke="rgba(244,114,182,0.3)" stroke-width="1"/>
  <text x="52" y="537" fill="#F472B6" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" filter="url(#smallGlow)">♥</text>
  <text x="85" y="527" fill="white" font-family="Arial, sans-serif" font-size="15" font-weight="600">Developed with care</text>
  <text x="85" y="544" fill="rgba(255,255,255,0.5)" font-family="Arial, sans-serif" font-size="11">Thanks for playing!</text>
</svg>
