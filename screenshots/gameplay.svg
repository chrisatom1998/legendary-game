<svg xmlns="http://www.w3.org/2000/svg" width="300" height="600" viewBox="0 0 300 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A237E"/>
      <stop offset="100%" style="stop-color:#7C4DFF"/>
    </linearGradient>
  </defs>
  <rect width="300" height="600" fill="url(#bg)"/>
  <!-- HUD - Score -->
  <text x="20" y="50" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">SCORE</text>
  <text x="20" y="75" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">1,250</text>
  <!-- HUD - High Score -->
  <text x="280" y="50" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="12" text-anchor="end">BEST: 3,450</text>
  <!-- Lives -->
  <text x="280" y="75" fill="white" font-family="Arial, sans-serif" font-size="20" text-anchor="end">❤️ ❤️ ❤️</text>
  <!-- Falling Objects -->
  <!-- Circle - Coral -->
  <circle cx="80" cy="150" r="30" fill="#FF6B6B" stroke="#CC5555" stroke-width="3"/>
  <!-- Square - Teal -->
  <rect x="180" y="220" width="55" height="55" fill="#4ECDC4" stroke="#3BA39B" stroke-width="3"/>
  <!-- Triangle - Yellow -->
  <polygon points="150,350 120,410 180,410" fill="#FFE66D" stroke="#CCB857" stroke-width="3"/>
  <!-- Diamond - Mint -->
  <polygon points="60,450 90,480 60,510 30,480" fill="#95E1D3" stroke="#77B8AA" stroke-width="3"/>
  <!-- Hexagon - Plum -->
  <polygon points="230,500 255,515 255,545 230,560 205,545 205,515" fill="#DDA0DD" stroke="#B080B0" stroke-width="3"/>
  <!-- Points popup -->
  <text x="80" y="130" fill="#FFD740" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">+15</text>
</svg>
