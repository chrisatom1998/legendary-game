<svg xmlns="http://www.w3.org/2000/svg" width="300" height="600" viewBox="0 0 300 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D1A"/>
      <stop offset="50%" style="stop-color:#1A1A3E"/>
      <stop offset="100%" style="stop-color:#2D1B4E"/>
    </linearGradient>
    <linearGradient id="pinkGrad" cx="30%" cy="30%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" style="stop-color:#FFB8D0"/>
      <stop offset="50%" style="stop-color:#FF6B9D"/>
      <stop offset="100%" style="stop-color:#CC4470"/>
    </linearGradient>
    <linearGradient id="cyanGrad" cx="30%" cy="30%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" style="stop-color:#80FAE8"/>
      <stop offset="50%" style="stop-color:#00F5D4"/>
      <stop offset="100%" style="stop-color:#00C4A8"/>
    </linearGradient>
    <linearGradient id="goldGrad" cx="30%" cy="30%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" style="stop-color:#FFF0A3"/>
      <stop offset="50%" style="stop-color:#FFE55C"/>
      <stop offset="100%" style="stop-color:#CCB647"/>
    </linearGradient>
    <linearGradient id="purpleGrad" cx="30%" cy="30%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" style="stop-color:#CDB4F0"/>
      <stop offset="50%" style="stop-color:#9B5DE5"/>
      <stop offset="100%" style="stop-color:#7B4AB8"/>
    </linearGradient>
    <linearGradient id="blueGrad" cx="30%" cy="30%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" style="stop-color:#80DDFC"/>
      <stop offset="50%" style="stop-color:#00BBF9"/>
      <stop offset="100%" style="stop-color:#0096C7"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="600" fill="url(#bg)"/>

  <!-- Background Stars -->
  <circle cx="40" cy="100" r="1" fill="white" opacity="0.5"/>
  <circle cx="260" cy="180" r="1.5" fill="#22D3EE" opacity="0.4"/>
  <circle cx="20" cy="300" r="1" fill="white" opacity="0.3"/>
  <circle cx="280" cy="400" r="1" fill="#A78BFA" opacity="0.4"/>
  <circle cx="150" cy="580" r="1" fill="white" opacity="0.3"/>

  <!-- HUD - Score Panel (Glassmorphism) -->
  <rect x="12" y="35" width="110" height="60" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="24" y="55" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">SCORE</text>
  <text x="24" y="80" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="1">001250</text>

  <!-- HUD - Lives Panel (Glassmorphism) -->
  <rect x="178" y="35" width="110" height="60" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <g transform="translate(195, 52)">
    <circle cx="0" cy="0" r="10" fill="#EF4444" filter="url(#smallGlow)"/>
    <circle cx="26" cy="0" r="10" fill="#EF4444" filter="url(#smallGlow)"/>
    <circle cx="52" cy="0" r="10" fill="#EF4444" filter="url(#smallGlow)"/>
  </g>
  <text x="276" y="80" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="11" text-anchor="end">3,450</text>

  <!-- Combo indicator -->
  <rect x="12" y="100" width="60" height="22" rx="11" fill="rgba(34,211,238,0.2)" stroke="rgba(34,211,238,0.5)" stroke-width="1"/>
  <text x="42" y="115" fill="#22D3EE" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">3x COMBO</text>

  <!-- Falling Objects with Glow -->

  <!-- Circle - Pink -->
  <circle cx="80" cy="170" r="28" fill="#FF6B9D" opacity="0.4" filter="url(#glow)"/>
  <circle cx="80" cy="170" r="26" fill="url(#pinkGrad)" stroke="#FFB8D0" stroke-width="2"/>

  <!-- Star - Gold -->
  <polygon points="200,240 207,258 227,258 211,270 217,288 200,277 183,288 189,270 173,258 193,258"
           fill="#FFE55C" opacity="0.4" filter="url(#glow)"/>
  <polygon points="200,240 207,258 227,258 211,270 217,288 200,277 183,288 189,270 173,258 193,258"
           fill="url(#goldGrad)" stroke="#FFF0A3" stroke-width="2"/>

  <!-- Diamond - Cyan -->
  <polygon points="100,380 130,410 100,440 70,410" fill="#00F5D4" opacity="0.4" filter="url(#glow)"/>
  <polygon points="100,380 130,410 100,440 70,410" fill="url(#cyanGrad)" stroke="#80FAE8" stroke-width="2"/>

  <!-- Hexagon - Purple -->
  <polygon points="220,470 245,485 245,515 220,530 195,515 195,485" fill="#9B5DE5" opacity="0.4" filter="url(#glow)"/>
  <polygon points="220,470 245,485 245,515 220,530 195,515 195,485" fill="url(#purpleGrad)" stroke="#CDB4F0" stroke-width="2"/>

  <!-- Pentagon - Blue -->
  <polygon points="60,520 80,540 72,565 48,565 40,540" fill="#00BBF9" opacity="0.4" filter="url(#glow)"/>
  <polygon points="60,520 80,540 72,565 48,565 40,540" fill="url(#blueGrad)" stroke="#80DDFC" stroke-width="2"/>

  <!-- Points popup with glass effect -->
  <rect x="50" y="125" width="60" height="32" rx="16" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="80" y="147" fill="#FBBF24" font-family="Arial, sans-serif" font-size="16" font-weight="900" text-anchor="middle" filter="url(#smallGlow)">+20</text>

  <!-- Particle effects (sparkles near destroyed shape) -->
  <circle cx="85" cy="155" r="2" fill="#FBBF24" opacity="0.8"/>
  <circle cx="70" cy="165" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="95" cy="160" r="1" fill="#FF6B9D" opacity="0.7"/>
</svg>
