<svg xmlns="http://www.w3.org/2000/svg" width="300" height="600" viewBox="0 0 300 600">
  <defs>
    <linearGradient id="btnPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
    <linearGradient id="btnSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE"/>
      <stop offset="100%" style="stop-color:#0891B2"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="50%" style="stop-color:#FDE68A"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
    <linearGradient id="highScoreBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="100%" style="stop-color:#FDE68A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="btnGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark overlay background -->
  <rect width="300" height="600" fill="#050510" opacity="0.95"/>

  <!-- Confetti pieces -->
  <rect x="40" cy="80" width="8" height="5" fill="#FBBF24" opacity="0.8" transform="rotate(25 44 82)"/>
  <rect x="260" y="100" width="6" height="4" fill="#8B5CF6" opacity="0.7" transform="rotate(-15 263 102)"/>
  <rect x="80" y="120" width="7" height="4" fill="#22D3EE" opacity="0.6" transform="rotate(45 83 122)"/>
  <rect x="220" y="150" width="8" height="5" fill="#F472B6" opacity="0.7" transform="rotate(-30 224 152)"/>
  <rect x="50" y="180" width="6" height="4" fill="#06B6D4" opacity="0.6" transform="rotate(15 53 182)"/>
  <rect x="250" y="220" width="7" height="4" fill="#FBBF24" opacity="0.5" transform="rotate(-45 253 222)"/>

  <!-- Game Over Title -->
  <text x="150" y="170" fill="white" font-family="Arial, sans-serif" font-size="40" font-weight="900" text-anchor="middle" letter-spacing="4">GAME OVER</text>

  <!-- Score Container (Glassmorphism) -->
  <rect x="60" y="210" width="180" height="120" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Score Label -->
  <text x="150" y="245" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="3">SCORE</text>

  <!-- Final Score -->
  <text x="150" y="300" fill="url(#goldGradient)" font-family="Arial, sans-serif" font-size="56" font-weight="900" text-anchor="middle" filter="url(#glow)">2850</text>

  <!-- New High Score Badge -->
  <rect x="80" y="345" width="140" height="32" rx="16" fill="url(#highScoreBadge)" filter="url(#glow)"/>
  <text x="150" y="367" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">NEW HIGH SCORE!</text>

  <!-- Play Again Button -->
  <rect x="50" y="420" width="200" height="54" rx="27" fill="url(#btnPrimary)" filter="url(#btnGlow)"/>
  <rect x="50" y="420" width="200" height="27" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="150" y="455" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">PLAY AGAIN</text>

  <!-- Main Menu Button -->
  <rect x="50" y="490" width="200" height="54" rx="27" fill="url(#btnSecondary)"/>
  <rect x="50" y="490" width="200" height="27" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="150" y="525" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">MAIN MENU</text>
</svg>
