<svg xmlns="http://www.w3.org/2000/svg" width="300" height="600" viewBox="0 0 300 600">
  <rect width="300" height="600" fill="rgba(0,0,0,0.9)"/>
  <!-- Game Over Title -->
  <text x="150" y="180" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" letter-spacing="4">GAME OVER</text>
  <!-- Final Score -->
  <text x="150" y="280" fill="white" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle">2,850</text>
  <!-- New High Score -->
  <text x="150" y="320" fill="#FFD740" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">NEW HIGH SCORE!</text>
  <!-- Play Again Button -->
  <rect x="75" y="400" width="150" height="50" rx="25" fill="#7C4DFF"/>
  <text x="150" y="432" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">PLAY AGAIN</text>
  <!-- Main Menu Button -->
  <rect x="75" y="470" width="150" height="50" rx="25" fill="transparent" stroke="#4ECDC4" stroke-width="2"/>
  <text x="150" y="502" fill="#4ECDC4" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">MAIN MENU</text>
</svg>
