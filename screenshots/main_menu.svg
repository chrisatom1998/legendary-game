<svg xmlns="http://www.w3.org/2000/svg" width="300" height="600" viewBox="0 0 300 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D1A"/>
      <stop offset="50%" style="stop-color:#1A1A3E"/>
      <stop offset="100%" style="stop-color:#2D1B4E"/>
    </linearGradient>
    <linearGradient id="btnPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
    <linearGradient id="btnSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE"/>
      <stop offset="100%" style="stop-color:#0891B2"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="50%" style="stop-color:#FDE68A"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="btnGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="600" fill="url(#bg)"/>

  <!-- Background Stars -->
  <circle cx="50" cy="80" r="1" fill="white" opacity="0.6"/>
  <circle cx="250" cy="120" r="1.5" fill="#22D3EE" opacity="0.5"/>
  <circle cx="30" cy="200" r="1" fill="white" opacity="0.4"/>
  <circle cx="270" cy="300" r="1" fill="#A78BFA" opacity="0.5"/>
  <circle cx="80" cy="450" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="220" cy="500" r="1" fill="#F472B6" opacity="0.4"/>
  <circle cx="100" cy="550" r="1" fill="#22D3EE" opacity="0.5"/>

  <!-- Floating Decorative Shapes -->
  <circle cx="60" cy="160" r="15" fill="#FF6B9D" opacity="0.1" filter="url(#glow)"/>
  <circle cx="240" cy="200" r="20" fill="#00F5D4" opacity="0.08" filter="url(#glow)"/>
  <rect x="220" y="400" width="25" height="25" rx="5" fill="#9B5DE5" opacity="0.1" transform="rotate(15 232 412)" filter="url(#glow)"/>
  <circle cx="70" cy="380" r="18" fill="#00BBF9" opacity="0.1" filter="url(#glow)"/>

  <!-- Title -->
  <text x="150" y="190" fill="white" font-family="Arial, sans-serif" font-size="56" font-weight="200" text-anchor="middle" letter-spacing="12" opacity="0.95">SKY</text>
  <text x="150" y="260" fill="url(#goldGradient)" font-family="Arial, sans-serif" font-size="56" font-weight="900" text-anchor="middle" letter-spacing="8" filter="url(#glow)">TAPS</text>

  <!-- Subtitle with glass effect -->
  <rect x="75" y="285" width="150" height="32" rx="16" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="150" y="306" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" letter-spacing="1">Tap the falling shapes!</text>

  <!-- Play Button -->
  <rect x="60" y="370" width="180" height="54" rx="27" fill="url(#btnPrimary)" filter="url(#btnGlow)"/>
  <rect x="60" y="370" width="180" height="27" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="150" y="405" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="2">PLAY</text>

  <!-- Settings Button -->
  <rect x="60" y="440" width="180" height="54" rx="27" fill="url(#btnSecondary)"/>
  <rect x="60" y="440" width="180" height="27" rx="14" fill="rgba(255,255,255,0.15)"/>
  <text x="150" y="475" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="2">SETTINGS</text>

  <!-- Version -->
  <text x="150" y="565" fill="rgba(255,255,255,0.4)" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" letter-spacing="2">v1.0.0</text>
</svg>
